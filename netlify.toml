[build]
  command = "npm run build"
  publish = "dist"

# Vite assets are content-hashed — safe to cache forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Data + reports change at most weekly — serve cached, revalidate in background
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/reports/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# The root serves the Astrolab landing page; the app itself lives under /lab.
# This must come before the SPA fallback — Netlify takes the first match.
# force = true is required: without it Netlify serves the existing static
# index.html at the root and never consults this rule.
[[redirects]]
  from = "/"
  to = "/landing.html"
  status = 200
  force = true

# SPA fallback — all other routes serve index.html so React Router handles them
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
