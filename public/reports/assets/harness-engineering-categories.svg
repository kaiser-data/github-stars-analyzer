<svg xmlns="http://www.w3.org/2000/svg" width="680" height="315" viewBox="0 0 680 315" role="img" aria-label="Tools per category">
<style>
text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
.srf{fill:#fcfcfb;stroke:#e4e4e0}.ttl{fill:#0b0b0b;font-size:13.5px;font-weight:600}
.lbl{fill:#52514e;font-size:11.5px}.val{fill:#0b0b0b;font-size:11.5px;font-weight:600}
.bar{fill:#2a78d6}
@media(prefers-color-scheme:dark){
.srf{fill:#1a1a19;stroke:#33332f}.ttl{fill:#ffffff}
.lbl{fill:#c3c2b7}.val{fill:#ffffff}.bar{fill:#3987e5}
}
</style>
<rect x="0.5" y="0.5" width="679" height="314" rx="8" class="srf"/>
<text x="14" y="25" class="ttl">Tools per category</text>
<text x="236" y="49.0" class="lbl" text-anchor="end" dominant-baseline="central">1. Minimal loop first</text>
